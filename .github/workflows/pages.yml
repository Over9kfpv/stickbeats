name: Redirect to rotordeck.com

# This repository moved to rotordeck/stickbeats. Pages now only serves redirects
# to https://rotordeck.com/stickbeats/, keeping the path of old links.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write redirect pages
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Moved to rotordeck.com</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://rotordeck.com/stickbeats/">
          <script>location.replace("https://rotordeck.com/stickbeats/"+location.pathname.replace(/^\/stickbeats\/?/,"")+location.search+location.hash)</script>
          <meta http-equiv="refresh" content="0; url=https://rotordeck.com/stickbeats/">
          </head><body><p>This app moved to <a href="https://rotordeck.com/stickbeats/">rotordeck.com/stickbeats</a>.</p></body></html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
